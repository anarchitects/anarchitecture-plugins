name: Main CI
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-ci:
    runs-on: ubuntu-latest
    # Bound coordinator/agent stalls, including failures outside Jest's timers.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      # setup-node invokes Yarn while restoring its cache.
      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      - run: corepack enable

      - run: yarn dlx nx-cloud start-ci-run --distribute-on="3 linux-medium-js-workspace-node" --stop-agents-after="lint,test,build,typecheck,e2e-ci"

      - run: yarn install --immutable
      - uses: nrwl/nx-set-shas@v5
      - run: yarn nx-cloud record -- yarn nx format:check
      - name: Run affected tasks on Nx Agents
        run: yarn nx affected -t lint test build typecheck e2e-ci
        # Leave time for fix-ci diagnostics before the overall job deadline.
        timeout-minutes: 15
      - run: yarn dlx -q -p typescript@5.9.3 tsc --project tsconfig.ts5.json --pretty false
      - run: yarn nx fix-ci
        if: always()
