name: Release (Manual)

env:
  NX_NO_CLOUD: 'true'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Optional Nx projects argument, for example nest-angular-ssr or better-auth-typeorm-adapter
        required: false
        type: string
      specifier:
        description: Optional Nx release specifier, for example patch, minor, prerelease, or an exact version like 0.0.1
        required: false
        type: string
      first_release:
        description: Treat the selected release as a first release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    environment: shared-bot-release
    runs-on: ubuntu-latest

    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'This workflow must run from main.'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0

      - name: Attach approved revision to local main
        run: git switch --force-create main "$GITHUB_SHA"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ANARCHITECTS_BOT_APP_ID }}
          private-key: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Configure git author for release commits
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name "anarchitects-bot[bot]"
          git config user.email "anarchitects-bot[bot]@users.noreply.github.com"

      - name: Run Nx release
        run: |
          args=(--skip-publish)

          if [ -n "$RELEASE_PROJECTS" ]; then
            args+=("--projects=$RELEASE_PROJECTS")
          fi

          if [ -n "$RELEASE_SPECIFIER" ]; then
            [[ "$RELEASE_SPECIFIER" != -* ]] || { echo 'Specifier must not be an option'; exit 1; }
            args+=("$RELEASE_SPECIFIER")
          fi

          if [ "$RELEASE_FIRST" = "true" ]; then
            args+=(--first-release)
          fi

          yarn nx release "${args[@]}"
        env:
          RELEASE_PROJECTS: ${{ inputs.projects }}
          RELEASE_SPECIFIER: ${{ inputs.specifier }}
          RELEASE_FIRST: ${{ inputs.first_release }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
